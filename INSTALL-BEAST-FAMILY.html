<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BEAST FAMILY">
  <title>BEAST FAMILY ❤️</title>
  <link rel="apple-touch-icon" href="./icon-192.png?v=10">
  <style>
    html,body{margin:0;min-height:100%;background:#0d0f12;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:420px;text-align:center;background:#171a1f;border:1px solid #2a2f37;border-radius:28px;padding:28px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    img{width:120px;height:120px;border-radius:26px}
    h1{margin:16px 0 8px;font-size:30px}
    p{color:#c8cdd5;line-height:1.45;margin:8px 0 20px}
    .tip{background:#24171d;border:1px solid #633040;border-radius:18px;padding:14px;font-weight:700}
    a{display:inline-block;margin-top:16px;color:white;background:linear-gradient(135deg,#ff4d73,#ff8a5b);padding:14px 18px;border-radius:16px;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <div class="card">
    <img src="./icon-192.png?v=10" alt="BEAST FAMILY">
    <h1>🦍 BEAST FAMILY ❤️</h1>
    <p>Cette page sert seulement à installer la bonne icône sur ton iPhone.</p>
    <div class="tip">Dans Safari : Partager → Ajouter à l’écran d’accueil</div>
    <a href="./index.html?v=10">Ouvrir l’app maintenant</a>
  </div>
<script>
  const standalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) location.replace('./index.html?v=10');
</script>
</body>
</html>
